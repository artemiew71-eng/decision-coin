<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Coin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23f2b705'/%3E%3Ccircle cx='50' cy='50' r='36' fill='none' stroke='%23b8860b' stroke-width='3'/%3E%3Ctext x='50' y='64' font-size='42' text-anchor='middle' fill='%23b8860b' font-family='Georgia'%3E%3F%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --ink: #2a241c;
    --muted: #7a7268;
    --accent: #d9930a;
    --accent-2: #c2410c;
    --border: #e8e1d5;
    --good: #3f7d4f;
    --shadow: 0 2px 10px rgba(60, 45, 10, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1913;
      --card: #262119;
      --ink: #f1ece0;
      --muted: #a79c88;
      --accent: #eab13a;
      --accent-2: #e2673f;
      --border: #3a3327;
      --good: #6fbf83;
      --shadow: 0 2px 12px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 2rem; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .card h2 { margin: 0 0 14px; font-size: 1.1rem; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 8px 6px 14px; font-size: 0.9rem;
  }
  .chip input[type="range"] { width: 70px; accent-color: var(--accent); }
  .chip .w-val { color: var(--muted); font-size: 0.8rem; min-width: 14px; text-align: center; }
  .chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; padding: 2px 4px; }
  .chip button:hover { color: var(--accent-2); }
  .add-row { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--ink); font-size: 0.95rem;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary {
    background: var(--accent); color: #211a08; border: none; border-radius: 8px;
    padding: 9px 16px; font-weight: 600; cursor: pointer; font-size: 0.95rem;
  }
  button.primary:hover { filter: brightness(1.07); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty-hint { color: var(--muted); font-size: 0.9rem; padding: 6px 2px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 8px; text-align: left; vertical-align: middle; }
  thead th { border-bottom: 2px solid var(--border); font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  .opt-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .opt-name .rm { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
  .opt-name .rm:hover { color: var(--accent-2); }
  .stars { display: flex; gap: 2px; cursor: pointer; }
  .stars span { font-size: 1.1rem; color: var(--border); }
  .stars span.filled { color: var(--accent); }
  .total-cell { font-weight: 700; white-space: nowrap; }
  .criteria-name { font-weight: 600; }
  .criteria-weight { color: var(--muted); font-weight: 400; font-size: 0.8rem; }
  .results-list { display: flex; flex-direction: column; gap: 10px; }
  .result-row { display: flex; align-items: center; gap: 12px; }
  .result-label { width: 140px; flex-shrink: 0; font-size: 0.92rem; display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 14px; background: var(--bg); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; transition: width 0.4s ease; }
  .result-score { width: 40px; text-align: right; font-variant-numeric: tabular-nums; font-size: 0.9rem; color: var(--muted); }
  .winner .result-label { font-weight: 700; color: var(--good); }
  .flip-zone { text-align: center; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border); }
  .flip-zone p { color: var(--muted); font-size: 0.9rem; margin: 0 0 10px; }
  .coin {
    width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe08a, var(--accent) 70%);
    border: 3px solid #a8720a;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 700; color: #6b4a05;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }
  .coin.flipping { animation: flip 1.1s ease-in-out; }
  @keyframes flip {
    0% { transform: rotateY(0deg) scale(1); }
    50% { transform: rotateY(900deg) scale(1.15); }
    100% { transform: rotateY(1440deg) scale(1); }
  }
  .flip-result { font-weight: 700; font-size: 1.05rem; min-height: 1.4em; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 30px; }
  .reset-link { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 0.85rem; }
  @media (max-width: 640px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tbody tr { padding: 12px 0; }
    td { padding: 4px 0; display: flex; align-items: center; justify-content: space-between; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 0.8rem; }
    .opt-name { padding-bottom: 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🪙 Decision Coin</h1>
    <p>Взвесь варианты по критериям — а если будет ничья, подбросим монетку</p>
  </header>

  <div class="card">
    <h2>Критерии</h2>
    <div class="chip-row" id="criteriaChips"></div>
    <div class="add-row">
      <input type="text" id="criteriaInput" placeholder="Например: Скорость, Важность, Энергозатратность" maxlength="40">
      <button class="primary" id="addCriteriaBtn">+ Критерий</button>
    </div>
  </div>

  <div class="card">
    <h2>Варианты</h2>
    <div class="add-row" style="margin-bottom: 14px;">
      <input type="text" id="optionInput" placeholder="Название варианта" maxlength="60">
      <button class="primary" id="addOptionBtn">+ Вариант</button>
    </div>
    <div id="tableZone"></div>
  </div>

  <div class="card" id="resultsCard" style="display:none;">
    <h2>Результаты</h2>
    <div class="results-list" id="resultsList"></div>
    <div class="flip-zone" id="flipZone" style="display:none;">
      <p>Топ варианты почти равны — доверим финальный выбор монетке?</p>
      <div class="coin" id="coin">🪙</div>
      <button class="primary" id="flipBtn">Подбросить монетку</button>
      <div class="flip-result" id="flipResult"></div>
    </div>
  </div>

  <footer>
    Данные хранятся только в этом браузере. <button class="reset-link" id="resetBtn">Сбросить всё</button>
  </footer>
</div>

<script>
const STORAGE_KEY = 'decision-coin-state-v1';

function uid() { return Math.random().toString(36).slice(2, 9); }

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {
    criteria: [
      { id: uid(), name: 'Скорость', weight: 3 },
      { id: uid(), name: 'Важность', weight: 5 },
      { id: uid(), name: 'Энергозатратность', weight: 2 }
    ],
    options: []
  };
}

let state = loadState();

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function render() {
  renderCriteria();
  renderTable();
  renderResults();
  save();
}

function renderCriteria() {
  const zone = document.getElementById('criteriaChips');
  zone.innerHTML = '';
  if (state.criteria.length === 0) {
    zone.innerHTML = '<span class="empty-hint">Добавь хотя бы один критерий</span>';
    return;
  }
  state.criteria.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `
      <span>${escapeHtml(c.name)}</span>
      <input type="range" min="1" max="10" value="${c.weight}" data-id="${c.id}" class="weight-slider">
      <span class="w-val">${c.weight}</span>
      <button data-id="${c.id}" class="rm-criteria" title="Удалить критерий">×</button>
    `;
    zone.appendChild(chip);
  });

  zone.querySelectorAll('.weight-slider').forEach(el => {
    el.addEventListener('input', e => {
      const c = state.criteria.find(x => x.id === e.target.dataset.id);
      c.weight = parseInt(e.target.value, 10);
      e.target.nextElementSibling.textContent = c.weight;
      renderTable();
      renderResults();
      save();
    });
  });
  zone.querySelectorAll('.rm-criteria').forEach(el => {
    el.addEventListener('click', e => {
      state.criteria = state.criteria.filter(x => x.id !== e.target.dataset.id);
      state.options.forEach(o => delete o.scores[e.target.dataset.id]);
      render();
    });
  });
}

function renderTable() {
  const zone = document.getElementById('tableZone');
  if (state.options.length === 0) {
    zone.innerHTML = '<p class="empty-hint">Добавь варианты, чтобы начать сравнение.</p>';
    return;
  }
  if (state.criteria.length === 0) {
    zone.innerHTML = '<p class="empty-hint">Сначала добавь хотя бы один критерий выше.</p>';
    return;
  }

  let html = '<table><thead><tr><th>Вариант</th>';
  state.criteria.forEach(c => {
    html += `<th><span class="criteria-name">${escapeHtml(c.name)}</span> <span class="criteria-weight">×${c.weight}</span></th>`;
  });
  html += '<th>Итог</th></tr></thead><tbody>';

  state.options.forEach(o => {
    const total = weightedTotal(o);
    html += `<tr data-opt="${o.id}"><td data-label="Вариант"><div class="opt-name"><span class="rm" data-id="${o.id}" title="Удалить">×</span>${escapeHtml(o.name)}</div></td>`;
    state.criteria.forEach(c => {
      const score = o.scores[c.id] || 0;
      html += `<td data-label="${escapeHtml(c.name)}"><div class="stars" data-opt="${o.id}" data-crit="${c.id}">${starsHtml(score)}</div></td>`;
    });
    html += `<td data-label="Итог" class="total-cell">${total === null ? '—' : total.toFixed(1) + ' / 5'}</td></tr>`;
  });
  html += '</tbody></table>';
  zone.innerHTML = html;

  zone.querySelectorAll('.stars').forEach(starEl => {
    starEl.querySelectorAll('span').forEach(starSpan => {
      starSpan.addEventListener('click', () => {
        const optId = starEl.dataset.opt;
        const critId = starEl.dataset.crit;
        const val = parseInt(starSpan.dataset.val, 10);
        const opt = state.options.find(o => o.id === optId);
        opt.scores[critId] = (opt.scores[critId] === val) ? val - 1 : val;
        render();
      });
    });
  });
  zone.querySelectorAll('.rm').forEach(el => {
    el.addEventListener('click', e => {
      state.options = state.options.filter(o => o.id !== e.target.dataset.id);
      render();
    });
  });
}

function starsHtml(score) {
  let s = '';
  for (let i = 1; i <= 5; i++) {
    s += `<span class="${i <= score ? 'filled' : ''}" data-val="${i}">★</span>`;
  }
  return s;
}

function weightedTotal(option) {
  const totalWeight = state.criteria.reduce((sum, c) => sum + c.weight, 0);
  if (totalWeight === 0) return null;
  const weighted = state.criteria.reduce((sum, c) => sum + (option.scores[c.id] || 0) * c.weight, 0);
  return weighted / totalWeight;
}

function renderResults() {
  const card = document.getElementById('resultsCard');
  const list = document.getElementById('resultsList');
  const flipZone = document.getElementById('flipZone');

  if (state.options.length === 0 || state.criteria.length === 0) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';

  const scored = state.options
    .map(o => ({ o, total: weightedTotal(o) || 0 }))
    .sort((a, b) => b.total - a.total);

  const max = scored[0].total;
  list.innerHTML = '';
  scored.forEach(({ o, total }, idx) => {
    const row = document.createElement('div');
    row.className = 'result-row' + (idx === 0 && total > 0 ? ' winner' : '');
    const pct = max > 0 ? (total / 5) * 100 : 0;
    row.innerHTML = `
      <div class="result-label">${idx === 0 && total > 0 ? '🏆 ' : ''}${escapeHtml(o.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="result-score">${total.toFixed(1)}</div>
    `;
    list.appendChild(row);
  });

  const EPS = 0.15;
  const tiedTop = scored.filter(s => max - s.total <= EPS && max > 0);
  if (tiedTop.length >= 2) {
    flipZone.style.display = 'block';
    document.getElementById('flipResult').textContent = '';
    document.getElementById('flipBtn').disabled = false;
    document.getElementById('flipBtn').onclick = () => flipCoin(tiedTop.map(t => t.o));
  } else {
    flipZone.style.display = 'none';
  }
}

function flipCoin(candidates) {
  const coin = document.getElementById('coin');
  const resultEl = document.getElementById('flipResult');
  const btn = document.getElementById('flipBtn');
  btn.disabled = true;
  resultEl.textContent = '';
  coin.classList.remove('flipping');
  void coin.offsetWidth;
  coin.classList.add('flipping');
  setTimeout(() => {
    const winner = candidates[Math.floor(Math.random() * candidates.length)];
    resultEl.textContent = `Монетка выбрала: ${winner.name} 🎉`;
    btn.disabled = false;
  }, 1100);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('addCriteriaBtn').addEventListener('click', () => {
  const input = document.getElementById('criteriaInput');
  const name = input.value.trim();
  if (!name) return;
  state.criteria.push({ id: uid(), name, weight: 3 });
  input.value = '';
  render();
});
document.getElementById('criteriaInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addCriteriaBtn').click();
});

document.getElementById('addOptionBtn').addEventListener('click', () => {
  const input = document.getElementById('optionInput');
  const name = input.value.trim();
  if (!name) return;
  state.options.push({ id: uid(), name, scores: {} });
  input.value = '';
  render();
});
document.getElementById('optionInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addOptionBtn').click();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Точно сбросить все критерии и варианты?')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = loadState();
  render();
});

render();
</script>
</body>
</html>
